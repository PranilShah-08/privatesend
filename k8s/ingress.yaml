apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatesend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "privatesend-service"
spec:
  rules:
    - host: privatesend.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privatesend-service
                port:
                  number: 80
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: privatesend-ai-service
                port:
                  number: 8000
