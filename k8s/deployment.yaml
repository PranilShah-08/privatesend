apiVersion: apps/v1
kind: Deployment
metadata:
  name: lossless-drop
  labels:
    app.kubernetes.io/name: lossless-drop
    app.kubernetes.io/component: web-signaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lossless-drop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lossless-drop
    spec:
      # Privacy & Security: Non-root user, no privilege escalation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: lossless-drop:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Strict Zero-Persistence Policy:
          # 1. readOnlyRootFilesystem guarantees no files can ever be saved to container disk
          # 2. emptyDir tmpfs volume is purely volatile memory (dropped on pod shutdown)
          # 3. ZERO PersistentVolumeClaims (PVCs)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ephemeral-tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ephemeral-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lossless-drop-ai-indexer
  labels:
    app.kubernetes.io/name: lossless-drop
    app.kubernetes.io/component: ai-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ai-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ai-indexer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: ai-indexer
          image: lossless-drop-ai-indexer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-ai
              containerPort: 8000
          env:
            - name: EPHEMERAL_MODE
              value: "true"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: ephemeral-tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: ephemeral-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
