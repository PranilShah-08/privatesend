apiVersion: v1
kind: Service
metadata:
  name: lossless-drop-service
  labels:
    app.kubernetes.io/name: lossless-drop
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: lossless-drop
---
apiVersion: v1
kind: Service
metadata:
  name: lossless-drop-ai-service
  labels:
    app.kubernetes.io/name: lossless-drop
    app.kubernetes.io/component: ai-indexer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/component: ai-indexer
