apiVersion: v1
kind: Service
metadata:
  name: privatesend-service
  labels:
    app.kubernetes.io/name: privatesend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: privatesend
---
apiVersion: v1
kind: Service
metadata:
  name: privatesend-ai-service
  labels:
    app.kubernetes.io/name: privatesend
    app.kubernetes.io/component: ai-indexer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/component: ai-indexer
